<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attrivue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--paper:#eef0ff;--surface:#fff;--surface2:#f1f2ff;--text:#171b37;--text2:#58617c;
--line:#cdd2e9;--line-soft:#e2e5f2;
--accent:#5145c8;--accent-text:#fff;--accent-soft:#eae9ff;
--red:#b52d3c;--red-soft:#fff0f2;--amber:#925a12;--amber-soft:#fff5e4;--green:#177054;--green-soft:#e5f6ef;
--r:14px;--sh:0 14px 36px rgba(20,21,66,.07);--sh-sm:0 4px 14px rgba(20,21,66,.09);
--fh:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
--fb:'IBM Plex Sans',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
--fm:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
html[data-theme="dark"]{
--paper:#0b0e23;--surface:#141a36;--surface2:#202746;--text:#f6f5ff;--text2:#bec3dc;
--line:#333d65;--line-soft:#293153;
--accent:#a99aff;--accent-text:#101128;--accent-soft:#2c2b57;
--red:#ff9eaa;--red-soft:#422634;--amber:#f1c883;--amber-soft:#423321;--green:#83dfb8;--green-soft:#1c3837;
--sh:0 16px 42px rgba(0,0,0,.22);--sh-sm:0 5px 16px rgba(0,0,0,.15);
}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--text);font-family:var(--fb);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--fh);line-height:1.2}
h1{font-size:26px}h2{font-size:20px}h3{font-size:17px}h4{font-size:14px}
a{color:var(--accent)}
.mono{font-family:var(--fm)}
.muted{color:var(--text2)}
.small{font-size:12.5px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--accent-soft)}
/* ===== layout ===== */
.shell{display:flex;min-height:100vh}
.sidebar{width:236px;flex:0 0 236px;background:radial-gradient(circle at 0 0,rgba(119,94,241,.34),transparent 50%),linear-gradient(155deg,#191648,#11172f 72%,#0b1028);border-right:1px solid rgba(192,196,255,.17);color:#f5f3ff;display:flex;flex-direction:column;padding:20px 12px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;font-family:var(--fh);font-weight:700;font-size:16px;line-height:1.22;padding:2px 8px 20px;border-bottom:1px solid rgba(192,196,255,.18);margin-bottom:18px;min-width:0}
.brand span{min-width:0;overflow-wrap:anywhere}
.brand-mark{width:40px;height:40px;flex:0 0 40px;display:grid;place-items:center;border-radius:11px;background:#9c8efa;color:#111126;font-family:var(--fh);font-size:15px;box-shadow:0 8px 22px rgba(133,112,239,.28)}
.brand-name{display:block}.brand-caption{display:block;margin-top:3px;font:600 10px var(--fm);letter-spacing:.12em;color:#bcbafb}
.nav{display:flex;flex-direction:column;gap:4px;flex:1}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid transparent;border-radius:10px;color:var(--text);text-decoration:none;font-weight:500;min-height:44px}
.nav-item:hover{background:var(--surface2)}
.nav-item.active{background:var(--accent-soft);border-color:var(--line);font-weight:600}
.sidebar .nav-item{color:#d2d5ed}
.sidebar .nav-item:hover{background:rgba(156,142,250,.13);color:#fff}
.sidebar .nav-item.active{background:rgba(156,142,250,.22);border-color:rgba(186,181,255,.3);box-shadow:none;color:#fff;font-weight:600}
.sidebar-foot{display:flex;flex-direction:column;gap:2px;padding:12px 8px 0;border-top:1px solid rgba(192,196,255,.18)}
.sidebar-foot .muted{color:#bfc3df}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;isolation:isolate;background:radial-gradient(circle at 10% 2%,rgba(125,104,241,.21),transparent 36%),radial-gradient(circle at 92% 64%,rgba(76,146,212,.13),transparent 44%),var(--paper)}
.main::before{content:'';position:absolute;z-index:0;inset:0;pointer-events:none;background-image:linear-gradient(rgba(92,93,158,.065) 1px,transparent 1px),linear-gradient(90deg,rgba(92,93,158,.065) 1px,transparent 1px);background-size:52px 52px;mask-image:linear-gradient(to bottom,black,transparent 85%)}
html[data-theme="dark"] .main{background:radial-gradient(circle at 7% 0,rgba(86,64,195,.37),transparent 40%),radial-gradient(circle at 92% 65%,rgba(35,98,156,.28),transparent 48%),var(--paper)}
html[data-theme="dark"] .main::before{background-image:linear-gradient(rgba(165,166,233,.065) 1px,transparent 1px),linear-gradient(90deg,rgba(165,166,233,.065) 1px,transparent 1px)}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 20px;background:#0d1029;border-bottom:1px solid rgba(192,196,255,.2);color:#f4f2ff}
.topbar .muted{color:#b4b8d5}
.topbar .input{background:#151a38;color:#f5f3ff;border-color:#373d66;box-shadow:none}
.topbar .tb-icon{background:#161b39;color:#f4f2ff;border-color:#393f6b;box-shadow:none}
.topbar .tb-icon:hover,.topbar .tb-icon[aria-pressed="true"]{background:#2b2d5b}
.topbar kbd{background:#242949;border-color:#3e466d;color:#c9c9ec}
.topbar .menu{color:var(--text)}
.tb-field{display:flex;align-items:center;gap:8px}
.tb-spacer{flex:1}
.tb-icon{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);box-shadow:var(--sh-sm);cursor:pointer;font-family:var(--fb);font-size:13.5px;color:var(--text)}
.tb-icon:hover{background:var(--surface2)}
.tb-icon:active{transform:translate(2px,2px);box-shadow:none}
.tb-icon[aria-pressed="true"]{background:var(--accent-soft)}
kbd{font-family:var(--fm);font-size:11px;border:1px solid var(--line-soft);border-radius:5px;padding:1px 5px;color:var(--text2);background:var(--paper)}
.view{position:relative;z-index:1;padding:28px 32px 96px;max-width:1240px;width:100%;margin:0 auto;min-width:0}
.view:focus{outline:none}
.bottombar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1.5px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:4px}
.bottombar .nav-item{flex:1;justify-content:center;padding:8px 2px;font-size:11px;flex-direction:column;gap:2px}
.bottombar .nav-item span{font-size:10.5px}
.more-wrap{position:relative;flex:1;display:flex}
.more-wrap .nav-item{width:100%}
.more-wrap .menu{top:auto;bottom:calc(100% + 10px);left:auto;right:0;min-width:min(270px,calc(100vw - 24px))}
@media (max-width:767px){
.sidebar{display:none}
.bottombar{display:flex}
.view{padding:16px 14px 120px}
.topbar{flex-wrap:wrap}
.tb-label,kbd{display:none}
.grid-2,.grid-3,.grid-4,.kpis,.wi-gauges,.form-grid{grid-template-columns:1fr!important}
}
@media (min-width:768px) and (max-width:1100px){.topbar{flex-wrap:wrap}}
@media (max-width:1023px) and (min-width:768px){.grid-4,.kpis{grid-template-columns:1fr 1fr}.grid-2,.grid-3{grid-template-columns:1fr}}
/* ===== components ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px;min-width:0}
.card h3{margin-bottom:10px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:var(--r);box-shadow:var(--sh);padding:16px;min-width:0}
.kpi-label{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi-num{font-family:var(--fm);font-size:clamp(20px,2vw,27px);font-weight:600;margin-top:4px;overflow-wrap:anywhere}
.kpi-sub{font-size:12.5px;color:var(--text2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font-family:var(--fb);font-size:14px;font-weight:600;cursor:pointer;box-shadow:var(--sh-sm);transition:transform .2s,box-shadow .2s,background .2s;text-decoration:none}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn-primary{background:var(--accent);color:var(--accent-text)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn-danger{background:var(--red);color:#fff}
html[data-theme="dark"] .btn-danger,html[data-theme="dark"] .banner{color:#230d1c}
html[data-theme="dark"] .banner button{color:#230d1c;border-color:#230d1c}
.btn-ghost{border-color:transparent;box-shadow:none;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none;transform:none}
.btn.loading::after{content:'';width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.input{display:block;width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font-family:var(--fb);font-size:14px}
.input:focus{outline:2px solid var(--accent);outline-offset:1px}
.input-sm{min-height:36px;padding:6px 10px;font-size:13px;width:auto}
.input.invalid{border-color:var(--red)}
textarea.input{min-height:80px;resize:vertical}
label{display:block;font-weight:600;font-size:13.5px;margin-bottom:14px}
label .input,label .num-wrap{margin-top:6px}
.num-wrap{display:flex;align-items:stretch}
.num-wrap .unit{display:flex;align-items:center;padding:0 10px;border:1.5px solid var(--line);background:var(--surface2);font-size:12.5px;color:var(--text2);font-family:var(--fm)}
.num-wrap .unit.pre{border-right:none;border-radius:10px 0 0 10px}
.num-wrap .input{border-radius:10px 0 0 10px}
.num-wrap .input+.unit{border-left:none;border-radius:0 10px 10px 0}
.num-wrap .unit.pre+.input{border-radius:0 10px 10px 0;border-left:1.5px solid var(--line)}
.switch{position:relative;width:46px;height:26px;border:1.5px solid var(--line);border-radius:13px;background:var(--surface2);cursor:pointer;flex:0 0 auto;transition:background .2s}
.switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border:1.5px solid var(--line);border-radius:50%;background:var(--surface);box-shadow:var(--sh-sm);transition:left .2s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"] .knob{left:22px;background:var(--accent-text)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1.5px solid;font-size:12.5px;font-weight:700;font-family:var(--fm);white-space:nowrap}
.r-high{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.r-med{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
.r-low{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.table-wrap{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--sh);overflow:auto;max-width:100%}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{font-family:var(--fh);text-align:left;padding:12px 14px;border-bottom:2px solid var(--line);background:var(--surface2);white-space:nowrap}
.table td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.table tbody tr:hover{background:var(--surface2)}
.table tbody tr:last-child td{border-bottom:none}
.th-btn{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center;font:inherit;min-height:32px}
.row-link{all:unset;cursor:pointer;color:var(--accent);font-weight:600}
.row-link:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-size:12.5px;font-weight:600;font-family:var(--fm)}
.chip-good{background:var(--green-soft);color:var(--green);border-color:var(--green)}
.chip-bad{background:var(--red-soft);color:var(--red);border-color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.callout{border:1.5px solid var(--line);border-left-width:6px;border-radius:10px;padding:12px 14px;background:var(--accent-soft);margin:12px 0;font-size:14px}
.callout.warn{background:var(--amber-soft);border-left-color:var(--amber)}
.callout.danger{background:var(--red-soft);border-left-color:var(--red)}
.empty{text-align:center;padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.skel{height:16px;border-radius:8px;background:var(--surface2);margin:10px 0;animation:pulse 1.2s ease-in-out infinite}
.skel-wrap{border:1.5px solid var(--line-soft);border-radius:var(--r);padding:16px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
#toasts{position:fixed;right:16px;bottom:16px;z-index:120;display:flex;flex-direction:column;gap:10px;max-width:min(420px,calc(100vw - 32px))}
@media (max-width:767px){#toasts{bottom:96px}}
.toast{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;box-shadow:var(--sh);padding:12px 14px;font-size:14px;animation:tin .2s ease}
.toast.out{opacity:0;transform:translateY(6px);transition:.2s}
.toast.t-alert{border-left:6px solid var(--red)}
.toast.t-check{border-left:6px solid var(--green)}
.toast.t-undo{border-left:6px solid var(--accent)}
.toast-btn{margin-left:auto;flex:0 0 auto;min-height:36px;padding:6px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--accent-soft);font-weight:700;cursor:pointer;font-family:var(--fb)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.modal-backdrop,.drawer-backdrop,.palette-backdrop,.tour-backdrop{position:fixed;inset:0;background:rgba(18,20,24,.5);z-index:60}
.modal{position:fixed;z-index:71;top:50%;left:50%;transform:translate(-50%,-50%);width:min(540px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto}
.drawer-backdrop{z-index:80}
.drawer{position:fixed;z-index:81;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--surface);border-left:1.5px solid var(--line);box-shadow:var(--sh);overflow-y:auto;padding:20px}
.drawer-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.drawer h3{margin:18px 0 8px}
.palette-backdrop{z-index:90}
.palette{position:fixed;z-index:91;top:12vh;left:50%;transform:translateX(-50%);width:min(600px,calc(100vw - 32px));padding:0;overflow:hidden}
.palette .input{border:none;border-bottom:1.5px solid var(--line);border-radius:0;box-shadow:none;min-height:52px;font-size:16px}
.palette ul{list-style:none;max-height:50vh;overflow:auto;padding:6px}
.palette li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;cursor:pointer;min-height:44px}
.palette li[aria-selected="true"],.palette li:hover{background:var(--accent-soft)}
.p-group{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);width:84px;flex:0 0 84px}
.p-hint{margin-left:auto;color:var(--text2);font-size:12.5px}
.tour-backdrop{z-index:95}
.tour{position:fixed;z-index:96;bottom:24px;right:24px;width:min(420px,calc(100vw - 32px))}
@media (max-width:767px){.tour{left:16px;right:16px;bottom:96px;width:auto}}
.tour-step{font-family:var(--fm);font-size:12px;color:var(--text2);margin-bottom:6px}
.menu{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;box-shadow:var(--sh);min-width:210px;padding:6px;z-index:50}
.user-menu{position:relative}
.menu-head{padding:8px 12px;font-size:13px;color:var(--text2);border-bottom:1px solid var(--line-soft);margin-bottom:4px}
.menu-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:10px 12px;border:none;background:none;border-radius:8px;cursor:pointer;font-family:var(--fb);font-size:14px;color:var(--text);min-height:44px;text-decoration:none}
.menu-item:hover{background:var(--surface2)}
/* ===== views ===== */
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.quick{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.headline{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:14px 18px;margin-bottom:20px;font-size:19px}
.workspace-banner{position:relative;overflow:hidden;background:radial-gradient(circle at 13% 15%,rgba(132,111,245,.5),transparent 44%),radial-gradient(circle at 85% 90%,rgba(42,113,170,.48),transparent 48%),linear-gradient(120deg,#15123e,#0e1530);color:#f7f5ff;border:1px solid rgba(160,160,244,.3);border-radius:18px;padding:28px 32px;margin-bottom:24px;box-shadow:0 22px 48px rgba(15,17,59,.15);animation:panel-enter .4s ease-out both}
.workspace-banner::before{content:'';position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);background-size:52px 52px}
.workspace-banner>*{position:relative}.workspace-banner .eyebrow{display:block;margin-bottom:8px;font:600 11px var(--fm);letter-spacing:.15em;color:#c2bdfd;text-transform:uppercase}.workspace-banner h1{font-size:clamp(28px,3vw,40px);margin-bottom:8px;overflow-wrap:anywhere}.workspace-banner p{color:#d1d1ec;max-width:65ch}
@media (max-width:640px){.workspace-banner{padding:22px 20px}.workspace-banner h1{font-size:28px}}
.attn{list-style:none}
.attn li{border-bottom:1px solid var(--line-soft)}
.attn li:last-child{border-bottom:none}
.attn button{all:unset;display:flex;flex-wrap:wrap;width:100%;gap:12px;align-items:center;padding:12px 6px;cursor:pointer;min-height:56px}
.attn button:hover{background:var(--surface2)}
.attn button>span:first-child{min-width:0;overflow-wrap:anywhere}
.a-name{font-weight:600}
.a-role{color:var(--text2);font-size:13px}
.a-risk{margin-left:auto;flex:0 0 auto}
.reasons-mini{display:flex;flex-wrap:wrap;gap:4px}
.reasons-mini span{font-size:11.5px;background:var(--surface2);border:1px solid var(--line-soft);border-radius:6px;padding:1px 7px;color:var(--text2)}
.risk-cell{display:flex;flex-direction:column;align-items:flex-start}
.risk-explain-link{display:inline-flex;align-items:center;min-height:44px;font-size:12.5px;text-align:left}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .input{width:auto;min-width:220px}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px}
.reason{margin-bottom:12px}
.reason-top{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;margin-bottom:4px}
.reason-top strong{font-weight:600}
.reason-value{color:var(--text2);font:500 12px var(--fm);white-space:nowrap}
.remark{border-top:1px solid var(--line-soft);padding-top:14px}
.remark-kicker{font:600 11px var(--fm);letter-spacing:.11em;text-transform:uppercase;color:var(--text2);margin-bottom:7px}
.remark-status{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.remark-explanation{font-size:13px;color:var(--text2);margin-bottom:12px}
.remark-reasons,.remark-actions{list-style:none;padding:0}
.remark-reasons li{margin-bottom:12px}
.remark-actions li{border-left:3px solid var(--accent);padding:1px 0 1px 12px;margin:0 0 14px}
.remark-actions strong,.remark-actions span{display:block}
.remark-actions span{font-size:12.5px;color:var(--text2);margin-top:4px}
.model-performance-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0}
.model-performance-list div{padding:9px 10px;border-radius:7px;background:var(--surface2);min-width:0}
.model-performance-list dt{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2)}
.model-performance-list dd{font:600 14px var(--fm);overflow-wrap:anywhere}

const sigmoid=z=>1/(1+Math.exp(-z));
function numOf(model,k,v){const n=Number(v);return Number.isFinite(n)?n:(model.medians[k]!==undefined?model.medians[k]:model.num[k].min);}
function scoreEmployee(model,emp){

 for(const k in model.cat){const c=model.cat[k];const v=emp[k];z+=(c&&Object.prototype.hasOwnProperty.call(c,v))?c[v]:0;}
 return sigmoid(z);
}

 const out=[];
 for(const k in model.num){const f=model.num[k];const v=numOf(model,k,emp[k]);out.push({field:k,kind:'num',value:v,c:f.coef*(v-f.mean)/f.scale});}
 for(const k in model.cat){const c=model.cat[k];const v=emp[k];const b=(c&&Object.prototype.hasOwnProperty.call(c,v))?c[v]:0;out.push({field:k,kind:'cat',value:v,c:b-(model.catbase[k]||0)});}

function applyAction(model,emp,action){
 const e=Object.assign({},emp);const k=action.k;
 switch(action.type){
  case 'set':if(!action.from||action.from.indexOf(emp[k])!==-1)e[k]=action.v;break;
  case 'min':e[k]=Math.min(action.v,numOf(model,k,emp[k]));break;
  case 'max':e[k]=Math.max(action.v,numOf(model,k,emp[k]));break;
  case 'mul':e[k]=Math.round(numOf(model,k,emp[k])*action.v);break;
  case 'up':
   if(action.order){const i=action.order.indexOf(emp[k]);if(i>-1&&i<action.order.length-1)e[k]=action.order[i+1];}
   else{const f=model.num[k];if(f)e[k]=Math.min(numOf(model,k,emp[k])+1,f.max);}

 catch(e){return fallback;}
}
function storageSet(key,value){
 try{localStorage.setItem(PREFIX+key,JSON.stringify(value));return true;}
 catch(e){toast('Storage is unavailable or full in this browser. Your changes may not be saved.','alert',8000);return false;}
}
function storageRemove(key){try{localStorage.removeItem(PREFIX+key);}catch(e){}}
function accountKey(username){return 'account.'+username;}
function loadAccount(username){return storageGet(accountKey(username),null);}
function saveAccount(){
 if(!state.user)return;
 const payload=accountPayload();
 storageSet(accountKey(state.user),payload);
 if(state.api&&state.token){api('/me',{method:'PUT',body:JSON.stringify(payload)}).catch(()=>{});}
}
function logAction(text){
 state.log.unshift({time:new Date().toISOString(),text});

const state={user:null,hash:null,created:null,modelId:'ibm',theme:'system',privacy:false,tourDone:false,customModels:[],models:{},log:[],scores:null,companyCache:null,token:null,api:false,modelReady:false,apiPromise:null,trainedRev:0,trainedScores:null,trainedPredictions:null,trainedAfter:null,wiSeq:0,whatifTrainedResult:null,lastScreen:null,modelMetadata:null,modelImportance:null,importanceSeq:0};
const API_BASE='/api';
function apiHeaders(){const h={'Content-Type':'application/json'};if(state.token)h.Authorization='Bearer '+state.token;return h;}
async function api(path,opts){
 const res=await fetch(API_BASE+path,Object.assign({headers:apiHeaders()},opts||{}));
 let body=null;try{body=await res.json();}catch(e){body=null;}
 if(!res.ok)throw new Error((body&&body.error)||'Request failed');
 return body;
}
function accountPayload(){return {hash:state.hash,created:state.created,schemaVersion:SCHEMA_VERSION,theme:state.theme,privacy:state.privacy,tourDone:state.tourDone,modelId:state.modelId,customModels:state.customModels,models:state.models,log:state.log};}
function currentModel(){return MODELS_BY_ID[state.modelId]||MODELS[0];}
function allModels(){return MODELS.concat(state.customModels);}
function registerCustomModels(){state.customModels.forEach(m=>{MODELS_BY_ID[m.id]=m;});}
function modelData(){const m=currentModel();if(!state.models[m.id])state.models[m.id]={employees:[],scenarios:[],snapshots:[]};return state.models[m.id];}
function employees(){return modelData().employees;}
function scenarios(){return modelData().scenarios;}
function snapshots(){return modelData().snapshots;}
function invalidateCache(){state.scores=null;state.companyCache=null;}
function employeeProbability(model,emp,scenarioKey){
 if(state.api&&model.id==='ibm'&&emp&&emp.id){
  if(scenarioKey==null&&state.trainedScores&&state.trainedScores[emp.id]!=null)return state.trainedScores[emp.id];
  if(scenarioKey!=null&&state.trainedAfter&&state.trainedAfter[scenarioKey]&&state.trainedAfter[scenarioKey][emp.id]!=null)return state.trainedAfter[scenarioKey][emp.id];
 }
 if(scenarioKey==='all')return scoreEmployee(model,applyAllActions(model,emp));
 if(scenarioKey!=null&&model.fix&&model.fix[scenarioKey])return scoreEmployee(model,applyAction(model,emp,model.fix[scenarioKey]));
 return scoreEmployee(model,emp);
}
function refreshTrainedScores(){
 if(!state.api||currentModel().id!=='ibm')return;
 const model=currentModel();
 const list=employees();
 const rev=++state.trainedRev;
  if(!list.length){state.trainedScores={};state.trainedPredictions={};state.trainedAfter={};invalidateCache();return;}
 const rows=[];const tags=[];
 list.forEach(emp=>{
  rows.push(emp);tags.push({id:emp.id,key:'base'});
  if(list.length<=800){
   model.fix.forEach((action,i)=>{rows.push(applyAction(model,emp,action));tags.push({id:emp.id,key:String(i)});});
   rows.push(applyAllActions(model,emp));tags.push({id:emp.id,key:'all'});
  }
 });
 api('/predict/batch',{method:'POST',body:JSON.stringify({employees:rows})}).then(out=>{
  if(rev!==state.trainedRev||currentModel().id!=='ibm')return;
   const scores={};const labels={};const after={};
  (out.predictions||[]).forEach((pred,i)=>{
   const tag=tags[i];
    if(tag.key==='base'){scores[tag.id]=pred.attrition_probability;labels[tag.id]=pred.prediction;}
   else{(after[tag.key]=after[tag.key]||{})[tag.id]=pred.attrition_probability;}
  });
   state.trainedScores=scores;state.trainedPredictions=labels;state.trainedAfter=after;invalidateCache();
  if(state.user)renderView();
 }).catch(()=>{});
}
function scoredEmployees(){
 if(!state.scores||state.scores.length!==employees().length){
  const m=currentModel();
  state.scores=employees().map(emp=>employeeProbability(m,emp));
 }
 return employees().map((emp,i)=>({emp,i,p:state.scores[i],lvl:riskLevel(state.scores[i])}));
}
function companyStats(){
 if(state.companyCache)return state.companyCache;
 const sc=scoredEmployees();
 const avg=sc.length?sc.reduce((s,x)=>s+x.p,0)/sc.length:0;
 const high=sc.filter(x=>x.lvl==='High').length;
  const medium=sc.filter(x=>x.lvl==='Medium').length;
  const low=sc.filter(x=>x.lvl==='Low').length;
 const expected=sc.reduce((s,x)=>s+x.p,0);
  state.companyCache={count:sc.length,avg,high,medium,low,expected};
 return state.companyCache;
}
function displayName(emp,i){return state.privacy?('Employee '+String(i+1).padStart(3,'0')):emp.name;}
function findEmp(id){return employees().find(e=>e.id===id)||null;}
function addEmployees(list,verb){
 modelData().employees.push.apply(modelData().employees,list);
 invalidateCache();saveAccount();
 logAction((verb||'Added')+' '+list.length+' employee'+(list.length===1?'':'s'));
 refreshTrainedScores();
}
function deleteEmployeesById(ids){
 const set=new Set(ids);const removed=[];const keep=[];
 employees().forEach((e,i)=>{if(set.has(e.id))removed.push({idx:i,emp:e});else keep.push(e);});
 modelData().employees=keep;
 invalidateCache();saveAccount();refreshTrainedScores();
 logAction('Deleted '+removed.length+' employee'+(removed.length===1?'':'s'));
 return removed;
}
function restoreEmployees(removed){
 const all=employees().map((emp,i)=>({idx:i,emp}));
 removed.forEach(r=>all.push(r));
 all.sort((a,b)=>a.idx-b.idx);
 modelData().employees=all.map(x=>x.emp);
 invalidateCache();saveAccount();refreshTrainedScores();
 logAction('Restored '+removed.length+' employee'+(removed.length===1?'':'s'));
}

 el.innerHTML=icon(type==='alert'?'alert':type==='undo'?'undo':'check',16)+'<span>'+esc(msg)+'</span>';
 if(action){
  const b=document.createElement('button');b.className='toast-btn';b.type='button';b.textContent=action.label;

}

function trapFocus(container){
 if(!container)return;
 const sel='button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])';
 const list=()=>Array.from(container.querySelectorAll(sel)).filter(el=>!el.disabled);
 const first=list()[0];if(first)first.focus();
 container.addEventListener('keydown',e=>{
  if(e.key!=='Tab')return;
  const l=list();if(!l.length)return;
  const f=l[0],last=l[l.length-1];
  if(e.shiftKey&&document.activeElement===f){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();f.focus();}
 });
}

function drawBarChart(sel,data,opts){
 opts=opts||{};
 const el=$(sel);if(!el)return;
 if(!data.length){el.innerHTML='<p class="muted">No data yet.</p>';return;}
 const W=560,H=260,padL=48,padB=64,padT=18,padR=8;
 const max=Math.max.apply(null,data.map(d=>d.value).concat([0.0001]));
 const iw=W-padL-padR,ih=H-padT-padB,bw=iw/data.length;
 let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(opts.alt||'Bar chart')+'"><title>'+esc(opts.alt||'Bar chart')+'</title>';
 for(let i=0;i<=4;i++){
  const v=max*i/4,y=padT+ih*(1-i/4);
  s+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" class="c-grid"/>';
  s+='<text x="'+(padL-6)+'" y="'+(y+4)+'" class="c-tick" text-anchor="end">'+(opts.fmt?opts.fmt(v):v.toFixed(2))+'</text>';
 }
 data.forEach((d,i)=>{
  const h=ih*(d.value/max);
  const x=padL+i*bw+bw*0.16,y=padT+ih-h,w=bw*0.68;
  const val=opts.fmt?opts.fmt(d.value):d.value.toFixed(2);
  s+='<g tabindex="0" role="img" aria-label="'+esc(d.label)+': '+esc(val)+'"><title>'+esc(d.label)+': '+esc(val)+'</title>'
   +'<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+(d.color||'var(--accent)')+'" class="c-bar"/>';
  if(h>14)s+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" class="c-tick" text-anchor="middle">'+esc(val)+'</text>';
  s+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-padB+16)+'" class="c-lab" text-anchor="end" transform="rotate(-35 '+(x+w/2).toFixed(1)+' '+(H-padB+16)+')">'+esc(trunc(d.label,16))+'</text></g>';
 });
 s+='</svg>';
 el.innerHTML=s;
}

 drawBarChart(sel,bins.map((c,i)=>({label:(i*10)+'–'+(i*10+10)+'%',value:c,color:'var(--accent)'})),{fmt:v=>String(Math.round(v)),alt:'Histogram of the risk distribution across employees, 10 bars from 0% to 100% risk'});
}
function drawLineChart(sel,pts){
 const el=$(sel);if(!el)return;
 if(!pts.length){el.innerHTML='<p class="muted">No snapshots yet.</p>';return;}
 const W=560,H=240,padL=48,padB=56,padT=16,padR=10;
 const max=Math.max.apply(null,[0.2].concat(pts.map(p=>p.value)));
 const iw=W-padL-padR,ih=H-padT-padB;
 const X=i=>padL+iw*(pts.length===1?0.5:i/(pts.length-1));
 const Y=v=>padT+ih*(1-v/max);
 let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Line chart of average risk over time"><title>Average risk over time</title>';
 for(let i=0;i<=4;i++){
  const v=max*i/4,y=Y(v);
  s+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" class="c-grid"/>';
  s+='<text x="'+(padL-6)+'" y="'+(y+4)+'" class="c-tick" text-anchor="end">'+fmtPct(v,0)+'</text>';
 }
 s+='<polyline points="'+pts.map((p,i)=>X(i).toFixed(1)+','+Y(p.value).toFixed(1)).join(' ')+'" class="c-line"/>';
 pts.forEach((p,i)=>{
  s+='<g tabindex="0" role="img" aria-label="'+esc(p.label)+': '+fmtPct(p.value)+'"><title>'+esc(p.label)+': '+fmtPct(p.value)+'</title>'
   +'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.value).toFixed(1)+'" r="4.5" class="c-dot"/></g>';
  s+='<text x="'+X(i).toFixed(1)+'" y="'+(H-padB+18)+'" class="c-lab" text-anchor="end" transform="rotate(-35 '+X(i).toFixed(1)+' '+(H-padB+18)+')">'+esc(p.label)+'</text>';
 });
 s+='</svg>';
 el.innerHTML=s;
}
function changeChip(a,b){
 const d=(b-a)*100;
 if(d>0.05)return '<span class="chip chip-bad">'+icon('arrow-up',12)+' +'+d.toFixed(1)+' pp</span>';
 if(d<-0.05)return '<span class="chip chip-good">'+icon('arrow-down',12)+' −'+Math.abs(d).toFixed(1)+' pp</span>';
 return '<span class="chip">'+icon('info',12)+' no change</span>';
}
function reasonsDiff(m,base,mod){
 const a=reasonsFor(m,base,TOP_DETAIL).map(r=>r.field);
 const b=reasonsFor(m,mod,TOP_DETAIL).map(r=>r.field);
 const appeared=b.filter(f=>a.indexOf(f)===-1);
 const resolved=a.filter(f=>b.indexOf(f)===-1);
 let out='';
 if(appeared.length)out+='<p><b class="c-red">Appeared:</b> '+appeared.map(f=>esc(reasonLabel(m,f,mod[f]))).join('; ')+'</p>';
 if(resolved.length)out+='<p><b class="c-green">Resolved:</b> '+resolved.map(f=>esc(reasonLabel(m,f,base[f]))).join('; ')+'</p>';
 if(!out)out='<p class="muted">No change in the top risk reasons.</p>';
 return out;
}

async function hashPassword(pw){
 const data=new TextEncoder().encode('attrition-predictor:'+pw);
 if(crypto.subtle&&crypto.subtle.digest){
  try{
   const buf=await crypto.subtle.digest('SHA-256',data);
   return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){/* fall through to local hash */}
 }
 let h1=0x811c9dc5,h2=0x01000193;const s='attrition-predictor:'+pw;
 for(let i=0;i<s.length;i++){h1=Math.imul(h1^s.charCodeAt(i),16777619)>>>0;h2=Math.imul(h2^s.charCodeAt(i),2166136261)>>>0;}
 return 'x'+h1.toString(16)+h2.toString(16);
}
function setLoginLoading(form,on){form.querySelectorAll('button').forEach(b=>{b.disabled=on;b.classList.toggle('loading',on);});}
async function handleLogin(form){
 const fd=new FormData(form);
 const username=(fd.get('username')||'').toString().trim();
 const password=(fd.get('password')||'').toString();
 const mode=fd.get('mode')||'signin';
 const err=$('#login-error');
 const show=m=>{err.textContent=m;err.hidden=false;};
 if(!username){show('Please enter a username.');return;}
 if(password.length<4){show('Password must be at least 4 characters.');return;}
 err.hidden=true;
 setLoginLoading(form,true);
 const hash=await hashPassword(password);
  if(state.apiPromise)await state.apiPromise;
 if(state.api){
  try{
   const out=await api(mode==='signup'?'/signup':'/login',{method:'POST',body:JSON.stringify({username,passwordHash:hash})});
   state.token=out.token;storageSet('token',out.token);
   signIn(username,Object.assign({hash:hash},out.account||{}));
   if(mode==='signup')toast('Account created — welcome!');
   return;
  }catch(e){setLoginLoading(form,false);show(e.message);return;}
 }
 const rec=loadAccount(username);
 if(mode==='signup'){
  if(rec){setLoginLoading(form,false);show('That username is already taken. Try signing in instead.');return;}
  const fresh={hash:hash,created:new Date().toISOString(),schemaVersion:SCHEMA_VERSION,theme:'system',privacy:false,tourDone:false,modelId:'ibm',customModels:[],models:{},log:[]};
  storageSet(accountKey(username),fresh);
  signIn(username,fresh);
  toast('Account created — welcome!');
 }else{
  if(!rec){setLoginLoading(form,false);show('No account found for that username. Create one first.');return;}
  if(rec.hash!==hash){setLoginLoading(form,false);show('That password is not correct.');return;}
  signIn(username,rec);
 }
}

 state.user=username;state.hash=rec.hash;state.created=rec.created;

 state.modelId=rec.modelId||'ibm';state.customModels=rec.customModels||[];state.models=rec.models||{};state.log=rec.log||[];

 if(!state.tourDone)showTour();
}

 state.user=null;state.hash=null;state.token=null;state.models={};state.log=[];state.customModels=[];state.scores=null;state.companyCache=null;

function globalImportancePanel(){

 if(!trainedModelAvailable(currentModel())){
  return '<section class="card"><h3>Top attrition drivers</h3><p class="ml-status">Dataset-wide trained-model importance is available when the trained IBM HR model is running. The other bundled models do not have this evaluation artifact.</p></section>';
 }

  loadGlobalImportance();
  return '<section class="card"><h3>Top attrition drivers</h3><div class="skel-wrap">'+skel()+'</div><p class="driver-method">Calculating from held-out test data.</p></section>';
 }
 if(data.error)return '<section class="card"><h3>Top attrition drivers</h3><p class="ml-status">'+esc(data.error)+'</p></section>';
 const rows=Array.isArray(data.features)?data.features.slice(0,8):[];
 const positive=rows.map(row=>Math.max(0,Number(row.importance_mean)||0));
 const max=Math.max(0.000001,...positive);
 const list=rows.map(row=>{
  const amount=Number(row.importance_mean)||0;
  const width=Math.max(0,Math.min(100,Math.max(0,amount)/max*100));
  return '<li><div class="importance-head"><strong>'+esc(featureNameLabel(row.feature))+'</strong><span class="importance-value">'+(amount>=0?'+':'')+amount.toFixed(4)+'</span></div><div class="importance-bar"><i class="'+(amount<0?'negative':'')+'" style="width:'+width.toFixed(1)+'%"></i></div></li>';
 }).join('');
 return '<section class="card"><h3>Top attrition drivers</h3><p class="driver-method">'+esc(data.method||'Held-out test-set feature importance')+'</p>'+(list?'<ol class="importance-list">'+list+'</ol>':'<p class="muted">No importance values in the trained artifact.</p>')+'<p class="muted small">Global ranking, not proof that a feature causes attrition.</p></section>';
}
function loadGlobalImportance(){
 if(!state.api||state.modelId!=='ibm'||state.importanceLoading)return;
 const modelId=state.modelId,seq=++state.importanceSeq;
 state.importanceLoading=true;
 api('/model/importance').then(data=>{
  if(seq!==state.importanceSeq)return;
  state.modelImportance=Object.assign({model_id:modelId},data);
  state.importanceLoading=false;
  if(state.user&&currentScreen()==='dashboard')renderView();
 }).catch(error=>{
  if(seq!==state.importanceSeq)return;
  state.modelImportance={model_id:modelId,error:error.message};
  state.importanceLoading=false;
  if(state.user&&currentScreen()==='dashboard')renderView();
 });
}

function employeeRemark(model,emp){
 const trained=trainedModelAvailable(model);
 const p=employeeProbability(model,emp);
 const reasons=trained?[]:reasonsFor(model,emp,TOP_DETAIL);
 const reasonFields=new Set(reasons.map(r=>r.field));
 const suggestions=trained?[]:model.fix.map((action,i)=>{
  const after=employeeProbability(model,emp,String(i));
  return {action,after,drop:p-after,related:reasonFields.has(action.k)};
 }).filter(s=>s.drop>=PERSONAL_ACTION_MIN_DROP)
  .sort((a,b)=>Number(b.related)-Number(a.related)||b.drop-a.drop).slice(0,TOP_LIST);
 return {p,reasons,suggestions,trained};
}
function employeeOutcomeHTML(model,emp,p){

 const ready=hasTrainedEmployeeScore(model,emp);

 const pred=trained?(state.trainedPredictions&&state.trainedPredictions[emp.id]||'Calculating…'):'Unavailable for bundled score';
 return '<section class="employee-outcome" aria-label="Employee model prediction"><dl class="employee-outcome-grid">'
  +'<div><dt>Risk level</dt><dd id="employee-risk-level">'+esc(level)+'</dd></div>'
  +'<div><dt>Attrition probability</dt><dd id="employee-probability">'+(trained&&!ready?'Calculating…':esc(fmtPct(probability,2)))+'</dd></div>'
  +'<div><dt>Prediction</dt><dd id="employee-prediction">'+esc(pred)+'</dd></div>'
  +'</dl></section>';
}
function riskRemarkExplanation(p){

  :'below the medium-risk line of '+fmtPct(RISK_MEDIUM_BOUNDARY,0);
 return 'This model estimates a '+fmtPct(p)+' chance of leaving, '+range+'. This label is a model estimate, not a fact about the employee.';
}
function xaiFactorList(factors,title){
 const section=document.createElement('section');section.className='xai-group';
 const heading=document.createElement('h4');heading.textContent=title;section.appendChild(heading);
 if(!Array.isArray(factors)||!factors.length){
  const empty=document.createElement('p');empty.className='muted small';empty.textContent='No individual features in this direction for this prediction.';section.appendChild(empty);return section;
 }
 const list=document.createElement('ol');list.className='xai-list';
 factors.forEach(factor=>{
  const item=document.createElement('li');
  const head=document.createElement('div');head.className='xai-factor-head';
  const name=document.createElement('span');name.className='xai-factor-name';name.textContent=factor.label+' = '+String(factor.value);
  const impact=document.createElement('span');impact.className='xai-factor-impact';
  const amount=Number(factor.contribution_percentage_points);
  impact.textContent=(amount>0?'+':'')+amount.toFixed(2)+' pp';
  head.append(name,impact);item.appendChild(head);
  const track=document.createElement('div');track.className='xai-meter';
  const bar=document.createElement('i');
  const weight=Math.max(0,Math.min(100,Number(factor.relative_importance)*100));
  bar.style.width=weight.toFixed(1)+'%';track.appendChild(bar);item.appendChild(track);list.appendChild(item);
 });
 section.appendChild(list);return section;
}
function renderTrainedExplanation(target,result){
 target.replaceChildren();
 const summary=document.createElement('p');summary.className='muted small';summary.textContent=result.explanation;target.appendChild(summary);
 const method=document.createElement('p');method.className='xai-intro';
 method.textContent=result.explanation_method+'; contribution values are approximate changes in model probability versus sampled training employees, not causes.';
 target.appendChild(method);
 target.appendChild(xaiFactorList(result.top_risk_factors,'Factors increasing the model estimate'));
 target.appendChild(xaiFactorList(result.protective_factors,'Factors decreasing the model estimate'));
}
function renderTrainedActions(target,employee,baseProbability,predictions,model){
 target.replaceChildren();
 const rows=(predictions||[]).map((result,index)=>({action:model.fix[index],probability:Number(result.probability),drop:baseProbability-Number(result.probability)}))
  .filter(row=>row.action&&Number.isFinite(row.probability)&&row.drop>0)
  .sort((a,b)=>b.drop-a.drop).slice(0,TOP_LIST);
 if(!rows.length){
  const p=document.createElement('p');p.className='muted small';p.textContent='The listed company actions did not lower this employee’s trained-model estimate. Consider a supportive conversation about working conditions.';target.appendChild(p);return;
 }
 const list=document.createElement('ul');list.className='remark-actions';
 rows.forEach(row=>{
  const li=document.createElement('li');const advice=document.createElement('strong');advice.textContent=actionAdvice(row.action);
  const detail=document.createElement('span');detail.textContent='In a what-if, the trained model estimate changes from '+fmtPct(baseProbability,2)+' to '+fmtPct(row.probability,2)+' (down '+(row.drop*100).toFixed(2)+' percentage points). This is a model estimate, not a promised result.';
  li.append(advice,detail);list.appendChild(li);
 });
 target.appendChild(list);
}
function requestEmployeeExplanation(id,employee,model){
 if(!trainedModelAvailable(model))return;
 const root=$('#drawer-root .drawer');
 if(root)root.dataset.employeeId=id;
 Promise.all([
  api('/predict',{method:'POST',body:JSON.stringify({features:employee})}),
  api('/predict/batch',{method:'POST',body:JSON.stringify({employees:model.fix.map(action=>applyAction(model,employee,action))})})
 ]).then(function(results){
  const current=$('#drawer-root .drawer');
  if(!current||current.dataset.employeeId!==id)return;
  const prediction=results[0];
  const p=Number(prediction.probability);
  if(!Number.isFinite(p)||!Array.isArray(prediction.top_risk_factors)||!Array.isArray(prediction.protective_factors)){
   throw new Error('The trained service returned an incomplete explanation.');
  }
  const head=$('#drawer-head-risk');if(head)head.innerHTML=riskBadge(p);
  const score=$('#remark-risk');if(score)score.innerHTML=riskBadge(p);
  const level=$('#employee-risk-level');if(level)level.textContent=prediction.risk_level;
  const probability=$('#employee-probability');if(probability)probability.textContent=fmtPct(p,2);
  const predictionLabel=$('#employee-prediction');if(predictionLabel)predictionLabel.textContent=prediction.prediction;
  const summary=$('#remark-explanation');if(summary)summary.textContent='The trained model estimates '+fmtPct(p)+' attrition probability; its prediction is '+prediction.prediction+'.';
  const output=$('#trained-explanation');if(output)renderTrainedExplanation(output,prediction);
  const actions=$('#trained-actions');if(actions)renderTrainedActions(actions,employee,p,results[1].predictions,model);
 }).catch(function(error){
  const current=$('#drawer-root .drawer');
  if(!current||current.dataset.employeeId!==id)return;
  const predictionLabel=$('#employee-prediction');if(predictionLabel)predictionLabel.textContent='Unavailable';
  const output=$('#trained-explanation');
  if(output){output.textContent='The trained-model explanation is unavailable: '+error.message;}
  const actions=$('#trained-actions');
  if(actions)actions.textContent='Trained-model action estimates are unavailable.';
 });
}

function parseCSVText(text){
 text=String(text).replace(/^﻿/,'').replace(/^\uFEFF/,'');
 const rows=[];let row=[],field='',q=false;
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else q=false;}else field+=c;}
  else if(c==='"')q=true;
  else if(c===','){row.push(field);field='';}
  else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
  else if(c!=='\r')field+=c;
 }
 if(field!==''||row.length){row.push(field);rows.push(row);}
 return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function normKey(s){return String(s).toLowerCase().replace(/[^a-z0-9]/g,'');}
function importCSV(text){
 const m=currentModel();
 const rows=parseCSVText(text);
 if(!rows.length)return {valid:[],rejected:[{row:1,reason:'The file is empty.'}],clipped:0,missing:Object.keys(m.num).concat(Object.keys(m.cat)),preview:[],total:0,truncated:false};
 const header=rows[0].map(normKey);
 const fieldFor={};
 Object.keys(m.num).concat(Object.keys(m.cat)).forEach(f=>{fieldFor[normKey(f)]=f;});
 const colField=header.map(h=>fieldFor[h]||null);
 const nameCols=new Set(['name','employeename','employee','fullname','worker']);
 const nameIdx=header.findIndex(h=>nameCols.has(h));
 const typical=typicalEmployee(m);
 const fields=Object.keys(m.num).concat(Object.keys(m.cat));
 const missing=fields.filter(f=>header.indexOf(normKey(f))===-1);
 if(nameIdx===-1)missing.unshift('name');
 let clipped=0,generatedNames=0;const valid=[],rejected=[];
 const seen=new Set(employees().map(e=>e.name.toLowerCase()));
 const body=rows.slice(1);
 let truncated=false;
 for(let ri=0;ri<body.length;ri++){
  if(valid.length+rejected.length>=MAX_CSV_ROWS){truncated=true;break;}
  const r=body[ri];const rowNum=ri+2;
   let name=nameIdx>-1?String(r[nameIdx]||'').trim():'Imported '+String(ri+1).padStart(3,'0');
   if(!name){rejected.push({row:rowNum,reason:'Missing name'});continue;}
   if(nameIdx===-1){
    const base=name;let suffix=2;
    while(seen.has(name.toLowerCase()))name=base+' '+suffix++;
   }
  if(seen.has(name.toLowerCase())){rejected.push({row:rowNum,reason:'Duplicate name'});continue;}
   const emp=Object.assign({},typical,{id:uid(),name:name});
  let bad=null;
  colField.forEach((f,ci)=>{
   if(!f)return;
   const raw=String(r[ci]||'').trim();
   if(m.num[f]){
    let v=raw===''?null:Number(raw);
    if(raw!==''&&!Number.isFinite(v)){bad='Column "'+header[ci]+'" is not a number';return;}
    if(v===null)v=typical[f];
    const spec=m.num[f];
    if(v<spec.min||v>spec.max){clipped++;v=Math.min(spec.max,Math.max(spec.min,v));}
     emp[f]=v;
   }else{
    const v=raw===''?typical[f]:raw;
    if(!Object.prototype.hasOwnProperty.call(m.cat[f],v)){bad='Unknown value "'+raw+'" for '+(FIELD_LABELS[f]||f);return;}
    emp[f]=v;
   }
  });
  if(bad){rejected.push({row:rowNum,reason:bad});continue;}
  seen.add(name.toLowerCase());
  valid.push(emp);
   if(nameIdx===-1)generatedNames++;
 }
 if(truncated)rejected.push({row:MAX_CSV_ROWS+2,reason:'Row limit of '+MAX_CSV_ROWS.toLocaleString('en-US')+' reached — extra rows ignored'});
  const preview=valid.slice(0,5).map(e=>({name:e.name,role:valueLabel(m.roleKey,e[m.roleKey]),risk:fmtPct(scoreEmployee(m,e))}));
 return {valid,rejected,clipped,generatedNames,missing,preview,total:Math.min(body.length,MAX_CSV_ROWS),truncated};
}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const SAMPLE_FIRST=['Ava','Liam','Noah','Emma','Olivia','Sophia','Mia','Lucas','Ethan','Isabella','Amelia','Jack','Chloe','Daniel','Layla','Mateo','Nora','Leo','Zoe','Owen','Ruby','Felix','Ivy','Hugo'];
const SAMPLE_LAST=['Carter','Nguyen','Müller','Rossi','Kowalski','Silva','Novak','Tanaka','Haddad','Petrov','Lindqvist','Okafor','Brown','Kim','Fischer','Reyes','Andersson','Costa','Weber','Hassan'];
function sampleCandidate(model,nums,cats,rng,intensity){
 const emp={};
 nums.forEach(([k,f])=>{
  const amount=Math.max(0,Math.min(1,intensity+(rng()-0.5)*SAMPLE_FIELD_VARIATION));
  const position=f.coef>=0?amount:1-amount;
  emp[k]=Math.max(f.min,Math.min(f.max,Math.round(f.min+(f.max-f.min)*position)));
 });
 cats.forEach(({k,values})=>{
  const amount=Math.max(0,Math.min(1,intensity+(rng()-0.5)*SAMPLE_FIELD_VARIATION));
  emp[k]=values.length?values[Math.round(amount*(values.length-1))]:model.catdef[k];
 });
 if(model.num.TotalWorkingYears&&model.num.YearsAtCompany)emp.YearsAtCompany=Math.min(emp.YearsAtCompany,emp.TotalWorkingYears);
 ['YearsInCurrentRole','YearsWithCurrManager','YearsSinceLastPromotion'].forEach(k=>{
  if(model.num[k]&&model.num.YearsAtCompany)emp[k]=Math.min(emp[k],emp.YearsAtCompany);
 });
 return emp;
}
function generateSample(){
 const model=currentModel();
 const rng=mulberry32(SAMPLE_SEED+employees().length);
 const nums=Object.entries(model.num);
 const cats=Object.entries(model.cat).map(([k,coeffs])=>({k,values:Object.keys(coeffs).sort((a,b)=>coeffs[a]-coeffs[b])}));
 const byDisplayedPercent=new Map();
 for(let i=0;i<SAMPLE_SIZE*SAMPLE_POOL_PER_EMPLOYEE;i++){
  const anchor=(i%SAMPLE_SIZE)/(SAMPLE_SIZE-1);
  const intensity=Math.max(0,Math.min(1,anchor+(rng()-0.5)*SAMPLE_PROFILE_VARIATION));
  const emp=sampleCandidate(model,nums,cats,rng,intensity);
  const p=scoreEmployee(model,emp);
  const display=fmtPct(p);
  if(!byDisplayedPercent.has(display))byDisplayedPercent.set(display,{emp,p,display});
 }
 const existing=new Set(employees().map(e=>fmtPct(scoreEmployee(model,e))));
 const all=Array.from(byDisplayedPercent.values());
 const unused=all.filter(row=>!existing.has(row.display));
 const choices=unused.length>=SAMPLE_SIZE?unused:all;
 const chosen=[],used=new Set();
 for(let i=0;i<SAMPLE_SIZE;i++){
  const target=i/(SAMPLE_SIZE-1);
  let nearest=null;
  for(const row of choices){
   if(used.has(row.display))continue;
   if(!nearest||Math.abs(row.p-target)<Math.abs(nearest.p-target))nearest=row;
  }
  if(!nearest)break;
  chosen.push(nearest);
  used.add(nearest.display);
 }
 let retries=0;
 while(chosen.length<SAMPLE_SIZE&&retries<SAMPLE_SIZE*SAMPLE_POOL_PER_EMPLOYEE){
  retries++;
  const emp=sampleCandidate(model,nums,cats,rng,rng());
  const p=scoreEmployee(model,emp);
  const display=fmtPct(p);
  if(used.has(display))continue;
  chosen.push({emp,p,display});
  used.add(display);
 }
 while(chosen.length<SAMPLE_SIZE){
  const emp=sampleCandidate(model,nums,cats,rng,rng());
  chosen.push({emp,p:scoreEmployee(model,emp)});
 }
 for(let i=chosen.length-1;i>0;i--){
  const j=Math.floor(rng()*(i+1));
  [chosen[i],chosen[j]]=[chosen[j],chosen[i]];
 }
 const names=new Set(employees().map(e=>e.name.toLowerCase()));
 return chosen.map((row,i)=>{
  const base=SAMPLE_FIRST[i%SAMPLE_FIRST.length]+' '+SAMPLE_LAST[(i*SAMPLE_LAST_NAME_STEP)%SAMPLE_LAST.length];
  let name=base,suffix=2;
  while(names.has(name.toLowerCase()))name=base+' '+suffix++;
  names.add(name.toLowerCase());
  return Object.assign({id:uid(),name},row.emp);
 });
}

function recalcPlanner(){
 planner.costs={};
 $$('#planner-form [data-pk]').forEach(el=>{planner.costs[el.dataset.pk]=Number(el.value)||0;});
 const rp=$('#pl-replacement'),pb=$('#pl-budget');
 planner.replacement=rp?Number(rp.value)||0:REPLACEMENT_COST_DEFAULT;
 planner.budget=pb?Number(pb.value)||0:0;
 const el=$('#planner-results');if(el)el.innerHTML=plannerResultsHTML();
}
function plannerResultsHTML(){
 const m=currentModel();const emps=employees();
 const rows=m.fix.map((a,i)=>{
  const s=actionStats(m,emps,a);
  const cost=(planner.costs[i]||0)*s.helped;
  const savings=s.prevented*planner.replacement;
  const net=savings-cost;
  return {advice:actionAdvice(a),helped:s.helped,prevented:s.prevented,cost,savings,net,roi:cost>0?net/cost:null};
 }).sort((a,b)=>b.net-a.net);
 if(!rows.length)return '<div class="card"><p class="muted">No company actions are available for this model.</p></div>';
 const maxNet=Math.max.apply(null,rows.map(r=>r.net).concat([0]));
 let html='<section class="card"><h3>Actions ranked by net saving '+infoTip('ROI = net saving ÷ cost. Shows "n/a" when the cost is 0.')+'</h3><div class="table-wrap"><table class="table"><thead><tr>'
  +'<th scope="col">Action</th><th scope="col">Employees helped</th><th scope="col">Leavers prevented</th><th scope="col">Cost</th><th scope="col">Savings</th><th scope="col">Net</th><th scope="col">ROI</th><th scope="col"></th></tr></thead><tbody>'
  +rows.map(r=>'<tr><td>'+esc(r.advice)+'</td><td class="mono">'+r.helped+'</td><td class="mono">'+r.prevented.toFixed(2)+'</td><td class="mono">'+fmtMoney(r.cost)+'</td><td class="mono">'+fmtMoney(r.savings)+'</td><td class="mono" style="color:'+(r.net>=0?'var(--green)':'var(--red)')+'"><b>'+fmtMoney(r.net)+'</b></td><td class="mono">'+(r.roi===null?'n/a':fmtPct(r.roi,0))+'</td><td style="min-width:120px"><div class="bar"><i style="width:'+(maxNet>0?Math.max(3,r.net/maxNet*100):3).toFixed(0)+'%"></i></div></td></tr>').join('')
  +'</tbody></table></div></section>';
 if(planner.budget>0){
  const free=rows.filter(r=>r.cost===0&&r.net>0);
  const paid=rows.filter(r=>r.cost>0).sort((a,b)=>(b.net/b.cost)-(a.net/a.cost));
  let spent=0;const picked=free.slice();
  paid.forEach(r=>{if(spent+r.cost<=planner.budget+1e-9){picked.push(r);spent+=r.cost;}});
  picked.sort((a,b)=>b.net-a.net);
  const totPrev=picked.reduce((s,r)=>s+r.prevented,0);
  const totNet=picked.reduce((s,r)=>s+r.net,0);
  html+='<section class="card"><h3>Best set within a budget of '+fmtMoney(planner.budget)+'</h3>'
   +(picked.length
    ?'<ul class="guide">'+picked.map(r=>'<li><b>'+esc(r.advice)+'</b> — cost '+fmtMoney(r.cost)+', prevents '+r.prevented.toFixed(2)+' leavers, net '+fmtMoney(r.net)+'</li>').join('')+'</ul><p>Total cost <b class="mono">'+fmtMoney(spent)+'</b> · leavers prevented <b class="mono">'+totPrev.toFixed(2)+'</b> · net saving <b class="mono">'+fmtMoney(totNet)+'</b></p>'
    :'<p class="muted">No action fits within this budget.</p>')
   +'</section>';
 }
 html+='<div class="callout warn">These are estimates. '+CAUSE_TEXT+'</div>';
 return html;
}

function policyGroupEmps(){

 if(policy.group==='all')return emps;
 if(policy.group.indexOf('risk:')===0)return emps.filter(e=>riskLevel(scoreEmployee(m,e))===policy.group.slice(5));
 return emps.filter(e=>e[m.deptKey]===policy.group);

function policyCalc(){
 const m=currentModel();const emps=policyGroupEmps();
 if(!emps.length)return null;

let paletteOpen=false,paletteIdx=0,paletteItems=[];
function openPalette(){
 paletteOpen=true;paletteIdx=0;
 $('#palette-root').innerHTML='<div class="palette-backdrop" data-action="palette-close"></div><div class="palette card" role="dialog" aria-modal="true" aria-label="Command palette">'
  +'<input id="palette-input" class="input" placeholder="Jump to a screen, find an employee, switch model…" autocomplete="off"><ul id="palette-list" role="listbox"></ul></div>';
 const inp=$('#palette-input');
 inp.addEventListener('input',()=>renderPaletteResults(inp.value));
 inp.focus();
 renderPaletteResults('');
}
function closePalette(){paletteOpen=false;$('#palette-root').innerHTML='';}
function paletteCommands(){
 const cmds=[];const m=currentModel();
 SCREENS.forEach(s=>cmds.push({label:'Go to '+s.name,group:'Screen',run:()=>{location.hash='#/'+s.id;}}));
 employees().slice(0,200).forEach((e,i)=>cmds.push({label:displayName(e,i),group:'Employee',hint:valueLabel(m.roleKey,e[m.roleKey]),run:()=>{location.hash='#/employees';setTimeout(()=>openEmployeeDrawer(e.id),60);}}));
 allModels().forEach(x=>cmds.push({label:'Switch to model '+x.name,group:'Model',run:()=>switchModel(x.id)}));
 cmds.push({label:isDark()?'Switch to light mode':'Switch to dark mode',group:'Action',run:()=>{setTheme(isDark()?'light':'dark');renderApp();}});
 cmds.push({label:state.privacy?'Turn off privacy mode':'Turn on privacy mode',group:'Action',run:()=>togglePrivacy()});
 return cmds;
}
function renderPaletteResults(q){
 q=(q||'').toLowerCase();
 paletteItems=paletteCommands().filter(c=>!q||(c.label+' '+(c.hint||'')+' '+c.group).toLowerCase().indexOf(q)>-1);
 if(paletteIdx>=paletteItems.length)paletteIdx=0;
 const list=$('#palette-list');if(!list)return;
 if(!paletteItems.length){list.innerHTML='<li class="muted" style="cursor:default">No matches.</li>';return;}
 list.innerHTML=paletteItems.map((c,i)=>'<li role="option" aria-selected="'+(i===paletteIdx)+'" data-pidx="'+i+'" data-action="palette-run"><span class="p-group">'+esc(c.group)+'</span><span>'+esc(c.label)+'</span>'+(c.hint?'<span class="p-hint">'+esc(c.hint)+'</span>':'')+'</li>').join('');
}
function paletteKey(e){
 if(e.key==='ArrowDown'){e.preventDefault();paletteIdx=(paletteIdx+1)%paletteItems.length;paintPaletteSel();}
 else if(e.key==='ArrowUp'){e.preventDefault();paletteIdx=(paletteIdx-1+paletteItems.length)%paletteItems.length;paintPaletteSel();}
 else if(e.key==='Enter'){e.preventDefault();const c=paletteItems[paletteIdx];if(c){closePalette();c.run();}}
}
function paintPaletteSel(){
 $$('#palette-list li[data-pidx]').forEach(li=>{
  const sel=+li.dataset.pidx===paletteIdx;
  li.setAttribute('aria-selected',String(sel));
  if(sel)li.scrollIntoView({block:'nearest'});
 });
}

function downloadBackup(){
 const payload={app:APP_NAME,schemaVersion:SCHEMA_VERSION,exported:new Date().toISOString(),modelId:state.modelId,models:state.models,customModels:state.customModels,log:state.log,theme:state.theme,privacy:state.privacy,tourDone:state.tourDone};

function handleBackupFile(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>applyBackupText(String(reader.result||''),file.name);
 reader.onerror=()=>toast('Could not read that file.','alert');
 reader.readAsText(file);
}
async function applyBackupText(text,name){
 let obj;
 try{obj=JSON.parse(text);}catch(e){toast('That file is not valid JSON.','alert');return;}
 if(!obj||typeof obj.models!=='object'||!obj.models){toast('That file does not look like an Attrivue backup.','alert');return;}
 const ok=await confirmDialog('Restore the backup "'+name+'"? This replaces all current records, scenarios and snapshots.','Restore backup',false);
 if(!ok)return;
 state.models=obj.models||{};state.customModels=obj.customModels||[];state.log=obj.log||[];
 state.theme=obj.theme||'system';state.privacy=!!obj.privacy;
 registerCustomModels();
 if(!MODELS_BY_ID[state.modelId])state.modelId='ibm';
 invalidateCache();applyTheme();saveAccount();renderApp();
 logAction('Restored backup from file');
 toast('Backup restored');
}
function validateModel(o){
 const errs=[];
 if(!o||typeof o!=='object'||Array.isArray(o))return ['The file does not contain a JSON object.'];
 if(typeof o.name!=='string'||!o.name.trim())errs.push('"name" must be a non-empty string.');
 ['intercept','hi','mid','base_rate','cv_auc','top10_prec','n'].forEach(k=>{if(typeof o[k]!=='number'||!Number.isFinite(o[k]))errs.push('"'+k+'" must be a number.');});
 if(!o.num||typeof o.num!=='object')errs.push('"num" must be an object of numeric fields.');
 else Object.keys(o.num).forEach(k=>{const f=o.num[k];if(!f||typeof f!=='object'){errs.push('"num.'+k+'" must be an object.');return;}['mean','scale','coef','min','max'].forEach(p=>{if(typeof f[p]!=='number'||!Number.isFinite(f[p]))errs.push('"num.'+k+'.'+p+'" must be a number.');});});
 if(!o.cat||typeof o.cat!=='object')errs.push('"cat" must be an object of category fields.');
 else Object.keys(o.cat).forEach(k=>{const c=o.cat[k];if(!c||typeof c!=='object'){errs.push('"cat.'+k+'" must be an object.');return;}Object.keys(c).forEach(v=>{if(typeof c[v]!=='number'||!Number.isFinite(c[v]))errs.push('"cat.'+k+'.'+v+'" must be a number.');});});
 ['catbase','medians'].forEach(key=>{
  if(!o[key]||typeof o[key]!=='object')errs.push('"'+key+'" must be an object.');
  else Object.keys(o[key]).forEach(k=>{if(typeof o[key][k]!=='number'||!Number.isFinite(o[key][k]))errs.push('"'+key+'.'+k+'" must be a number.');});
 });
 if(!o.catdef||typeof o.catdef!=='object')errs.push('"catdef" must be an object.');
 if(typeof o.roleKey!=='string'||!o.roleKey)errs.push('"roleKey" must be a string.');
 if(typeof o.deptKey!=='string'||!o.deptKey)errs.push('"deptKey" must be a string.');
 if(!Array.isArray(o.fix))errs.push('"fix" must be an array of company actions.');
 else o.fix.forEach((a,i)=>{if(!a||typeof a.k!=='string'||['set','min','max','mul','up'].indexOf(a.type)===-1)errs.push('"fix['+i+']" must have a field "k" and a valid "type" (set, min, max, mul, up).');});
 return errs;
}
let pendingModelFile='';
function handleModelFile(file){
 if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{pendingModelFile=String(reader.result||'');const ta=$('#model-json');if(ta)ta.value=pendingModelFile;toast('File loaded — press "Validate & add model".');};
 reader.onerror=()=>toast('Could not read that file.','alert');
 reader.readAsText(file);
}
function handleModelAdd(){
 const ta=$('#model-json'),msg=$('#model-msg');
 const text=((ta&&ta.value)||'').trim()||pendingModelFile;
 if(!text){msg.innerHTML='<p class="c-red">Paste a model JSON or upload a file first.</p>';return;}
 let obj;
 try{obj=JSON.parse(text);}catch(e){msg.innerHTML='<p class="c-red">That is not valid JSON: '+esc(e.message)+'</p>';return;}
 const errs=validateModel(obj);
 if(errs.length){msg.innerHTML='<p class="c-red">The model was rejected:</p><ul class="rej">'+errs.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul>';return;}
 obj.id=slug(obj.name);let n=2;
 while(MODELS_BY_ID[obj.id]){obj.id=slug(obj.name)+'-'+n;n++;}
 obj.name=obj.name.trim();
 state.customModels.push(obj);MODELS_BY_ID[obj.id]=obj;
 saveAccount();logAction('Imported model "'+obj.name+'"');
 msg.innerHTML='<p class="c-green">Model "'+esc(obj.name)+'" added. It appears in the model selector.</p>';
 if(ta)ta.value='';pendingModelFile='';
 toast('Model "'+obj.name+'" added');
 renderApp();
}

/* ===== THEME & PRIVACY ===== */
function isDark(){
 if(state.theme==='dark')return true;
 if(state.theme==='light')return false;
 return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
}
function applyTheme(){document.documentElement.dataset.theme=isDark()?'dark':'light';}
function setTheme(t){state.theme=t;applyTheme();saveAccount();}
function togglePrivacy(){
 state.privacy=!state.privacy;saveAccount();renderApp();
 toast(state.privacy?'Privacy mode on — names are hidden everywhere.':'Privacy mode off.');
}
function switchModel(id){
 if(!MODELS_BY_ID[id])return;
 state.modelId=id;state.trainedScores=null;state.trainedAfter=null;csvResult=null;csvPendingText='';csvPendingName='';invalidateCache();saveAccount();renderApp();refreshTrainedScores();
}

function hideUserMenu(){const m=$('#user-menu');if(m)m.hidden=true;const b=$('#user-btn');if(b)b.setAttribute('aria-expanded','false');}
function handleAction(action,t){
 switch(action){
  case 'login-tab':loginViewMode=t.dataset.mode==='signup'?'signup':'signin';renderApp();break;
  case 'toggle-pw':{const inp=t.closest('.pw-wrap').querySelector('input');const show=inp.type==='password';inp.type=show?'text':'password';t.innerHTML=icon(show?'eye-off':'eye',16);t.setAttribute('aria-label',show?'Hide password':'Show password');break;}
  case 'open-palette':openPalette();break;
  case 'palette-close':closePalette();break;
  case 'palette-run':{const c=paletteItems[+t.dataset.pidx];if(c){closePalette();c.run();}break;}
  case 'toggle-privacy':togglePrivacy();break;
  case 'toggle-theme':setTheme(isDark()?'light':'dark');renderApp();break;
  case 'toggle-usermenu':{const menu=$('#user-menu');const open=menu.hidden;menu.hidden=!open;t.setAttribute('aria-expanded',String(open));break;}
  case 'signout':signOut();break;
  case 'goto':{
   const target='#/'+(t.dataset.to||'dashboard')+(t.dataset.tab?'?tab='+t.dataset.tab:'');
   if(location.hash===target)renderView();else location.hash=target;
   break;
  }
  case 'about-model':location.hash='#/settings';setTimeout(()=>{const el=$('#about-model');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},80);break;
  case 'drawer-close':closeDrawer();break;
  case 'modal-resolve':resolveModal(t.dataset.v==='1');break;
  case 'add-tab':{
   const tab=t.dataset.tab;
   if(['form','csv','sample'].indexOf(tab)===-1)break;
   const target='#/add?tab='+tab;
   if(location.hash===target)renderView();else location.hash=target;
   break;
  }
  case 'sample':{
   const emps=generateSample();
   const unique=new Set(emps.map(emp=>fmtPct(scoreEmployee(currentModel(),emp)))).size;
   addEmployees(emps,'Loaded');
   toast('Loaded '+emps.length+' sample employees with '+unique+' different leaving percentages.');
   if(location.hash==='#/dashboard')renderView();else location.hash='#/dashboard';
   break;
  }
  case 'csv-browse':$('#csv-file').click();break;
  case 'csv-template':downloadCsvTemplate();break;
  case 'csv-parse':csvParseAction();break;
  case 'csv-confirm':csvConfirmAction();break;
  case 'csv-cancel':csvResult=null;csvPendingText='';csvPendingName='';renderView();break;
  case 'sort':{const k=t.dataset.key;if(empView.sortKey===k)empView.sortDir*=-1;else{empView.sortKey=k;empView.sortDir=(k==='p'?-1:1);}empView.page=0;renderView();break;}
  case 'page-prev':empView.page=Math.max(0,empView.page-1);renderView();break;
  case 'page-next':empView.page=empView.page+1;renderView();break;
  case 'emp-reset-filters':empView.q='';empView.risk='';empView.group='';empView.page=0;renderView();break;
  case 'emp-row':openEmployeeDrawer(t.dataset.id);break;
  case 'emp-delete':deleteOneEmployee(t.dataset.id);break;
  case 'emp-bulk':deleteSelectedEmployees();break;
  case 'emp-clear':clearAllEmployees();break;
  case 'whatif-open':closeDrawer();whatif.empId=t.dataset.id;whatif.vals={};if(location.hash.indexOf('#/whatif')===0)renderView();else location.hash='#/whatif';break;
  case 'whatif-reset':whatif.vals={};renderView();break;
  case 'whatif-apply':{const m=currentModel();const emp=findEmp(whatif.empId);if(!emp)break;const mod=applyAllActions(m,emp);whatif.vals={};whatifFields(m).forEach(k=>{whatif.vals[k]=mod[k];});renderView();toast('Applied all company actions to the what-if copy.');break;}
  case 'scenario-delete':modelData().scenarios=modelData().scenarios.filter(s=>s.id!==t.dataset.id);saveAccount();logAction('Deleted a scenario');toast('Scenario deleted');renderView();break;
  case 'scenario-clear':confirmDialog('Delete all saved scenarios?','Clear scenarios').then(ok=>{if(!ok)return;modelData().scenarios=[];saveAccount();logAction('Cleared all scenarios');toast('Scenarios cleared');renderView();});break;
  case 'scenario-compare':compareScenarios();break;
  case 'export-csv':exportCSV();break;
  case 'print-report':window.print();break;
  case 'snapshot-save':saveSnapshot();break;
  case 'snapshot-delete':modelData().snapshots=modelData().snapshots.filter(s=>s.id!==t.dataset.id);saveAccount();logAction('Deleted a snapshot');toast('Snapshot deleted');renderView();break;
  case 'snapshot-clear':confirmDialog('Delete all snapshots?','Clear snapshots').then(ok=>{if(!ok)return;modelData().snapshots=[];saveAccount();logAction('Cleared all snapshots');toast('Snapshots cleared');renderView();});break;
  case 'retention-guide':openRetentionGuide(t.dataset.id);break;
  case 'run-selftest':runSelftestAction();break;
  case 'backup-download':downloadBackup();break;
  case 'model-add':handleModelAdd();break;
  case 'log-clear':state.log=[];saveAccount();toast('Activity log cleared');renderView();break;
  case 'tour-next':tourStep++;renderTour();break;
  case 'tour-prev':tourStep=Math.max(0,tourStep-1);renderTour();break;
  case 'tour-done':case 'tour-skip':endTour();break;
  case 'more-menu':{const menu=$('#more-menu');if(menu){const open=menu.hidden;menu.hidden=!open;t.setAttribute('aria-expanded',String(open));}break;}
  case 'toggle-switch':{
   const sw=$('#'+t.dataset.target);
   const on=sw.getAttribute('aria-checked')!=='true';
   sw.setAttribute('aria-checked',String(on));
   if(t.dataset.target==='privacy-switch'){state.privacy=on;saveAccount();toast(on?'Privacy mode on — names are hidden everywhere.':'Privacy mode off.');renderApp();}
   break;
  }
 }
}
function onDocClick(e){
 if(!e.target.closest('.user-menu'))hideUserMenu();
 if(!e.target.closest('.more-wrap')){const mm=$('#more-menu');if(mm)mm.hidden=true;}
 const t=e.target.closest('[data-action]');
 if(t)handleAction(t.dataset.action,t);
}
const debouncedEmpFilter=debounce(v=>{empView.q=v;empView.page=0;renderView();},DEBOUNCE_MS);
function onDocInput(e){
 const t=e.target;
 if(t.id==='emp-search'){debouncedEmpFilter(t.value);return;}
 if(t.id==='palette-input')return;
 if(t.classList.contains('wi-slider')){
  whatif.vals[t.dataset.k]=t.value;
  const out=$('#wi-out-'+t.dataset.k);
  if(out)out.textContent=fmtField(currentModel(),t.dataset.k,t.value);
  scheduleWhatifUpdate();return;
 }
 if(t.classList.contains('wi-select')){whatif.vals[t.dataset.k]=t.value;scheduleWhatifUpdate();return;}
 if(t.closest&&t.closest('#add-form')){
  t.classList.remove('invalid');
  const err=$('#form-error');
  if(err&&!err.hidden&&!$('#add-form').querySelector('.invalid'))err.hidden=true;
 }
}
function onDocChange(e){
 const t=e.target;
 if(t.id==='model-select'){switchModel(t.value);return;}
 if(t.id==='theme-select'){setTheme(t.value);return;}
 if(t.id==='wi-search'){
  const name=t.value.trim();
  const idx=employees().findIndex((e,i)=>displayName(e,i)===name);
  if(idx>-1){whatif.empId=employees()[idx].id;whatif.vals={};renderView();}
  else toast('No employee with that name.','alert');
  return;
 }
 if(t.id==='csv-file'){handleCsvFile(t.files[0]);return;}
 if(t.id==='backup-file'){handleBackupFile(t.files[0]);return;}
 if(t.id==='model-file'){handleModelFile(t.files[0]);return;}
 if(t.id==='emp-check-all'){
  const rows=currentPageRows();
  rows.forEach(r=>{if(t.checked)empView.selected.add(r.emp.id);else empView.selected.delete(r.emp.id);});
  syncBulkBtn();return;
 }
 if(t.matches('[data-check]')){
  const id=t.dataset.id;
  if(t.checked)empView.selected.add(id);else empView.selected.delete(id);
  syncBulkBtn();syncCheckAll();return;
 }
 if(t.matches('[data-filter]')){empView[t.dataset.filter]=t.value;empView.page=0;renderView();return;}
 if(t.closest&&t.closest('#planner-form')){recalcPlanner();return;}
 if(t.closest&&t.closest('#policy-form')){policy.group=$('#pol-group').value;policy.action=$('#pol-action').value;recalcPolicy();return;}
}
function onDocSubmit(e){
 if(e.target.id==='login-form'){e.preventDefault();handleLogin(e.target);}
 else if(e.target.id==='add-form'){e.preventDefault();handleAddForm(e.target);}
 else if(e.target.id==='whatif-save-form'){e.preventDefault();saveWhatifScenario(e.target);}
 else if(e.target.id==='policy-save-form'){e.preventDefault();savePolicyScenario(e.target);}
 else{e.preventDefault();}
}
function onDocKey(e){
 if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='k'){e.preventDefault();if(paletteOpen)closePalette();else openPalette();return;}
 if(e.key==='Escape'){
  if(paletteOpen)closePalette();
  else if($('#modal-root').children.length)resolveModal(false);
  else if($('#drawer-root').children.length)closeDrawer();
  else hideUserMenu();
  return;
 }
 if(paletteOpen&&e.target.id==='palette-input'){paletteKey(e);return;}
}

/* ===== BOOT ===== */
function showBanner(msg){
 let b=$('#banner');
 if(!b){document.body.insertAdjacentHTML('beforeend','<div class="banner" id="banner" role="alert"></div>');b=$('#banner');}
 b.innerHTML=icon('alert',16)+'<span>'+esc(msg)+'</span><button data-action="goto" data-to="settings">Open Settings</button>';
 b.hidden=false;
}
function boot(){
 applyTheme();
 state.apiPromise=api('/health').then(health=>{
  state.api=true;state.modelReady=!!(health&&health.modelReady);
  if(state.user)refreshTrainedScores();
  return api('/model/metadata').then(out=>{
   if(out&&out.valid&&out.metadata)state.modelMetadata=out.metadata;
  }).catch(()=>null);
 }).then(()=>{if(state.user)renderView();}).catch(()=>{state.api=false;state.modelReady=false;});
 document.addEventListener('click',onDocClick);
 document.addEventListener('change',onDocChange);
 document.addEventListener('input',onDocInput);
 document.addEventListener('submit',onDocSubmit);
 document.addEventListener('keydown',onDocKey);
 window.addEventListener('hashchange',renderApp);
 if(window.matchMedia){
  const mq=window.matchMedia('(prefers-color-scheme: dark)');
  const onChange=()=>{if(state.theme==='system')applyTheme();};
  if(mq.addEventListener)mq.addEventListener('change',onChange);
  else if(mq.addListener)mq.addListener(onChange);
 }
 const lastUser=storageGet('session',null);
 let resumed=false;
 if(lastUser){const rec=loadAccount(lastUser);if(rec){signIn(lastUser,rec);resumed=true;}}
 if(!location.hash)location.hash='#/dashboard';
 if(!resumed)renderApp();
 const results=runSelfTest();
 const failed=results.filter(r=>!r.pass);
 if(failed.length)showBanner(failed.length+' of '+results.length+' self-test checks failed. Open Settings → Self-test for details.');
}
boot();
</script>
</body>
</html>
